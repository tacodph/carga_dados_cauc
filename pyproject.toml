[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauc-ingest"
version = "0.1.0"
description = "Ingestão semanal do CAUC (Tesouro Nacional) no PostgreSQL transferepro, schema base_tesouro_nacional"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "holidays>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
cauc-ingest = "cauc_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cauc_ingest = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integracao'"
markers = ["integracao: trunca as tabelas cauc_* do transferepro (exige CAUC_TESTE_BANCO=1)"]
